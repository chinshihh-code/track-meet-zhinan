<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B83A26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="指南田徑賽程">
<title>指南實小田徑賽程｜家長版</title>
<style>
:root{
  --bg:#F6F3EE; --card:#FFFFFF; --ink:#1E1B18; --ink2:#5F5A54; --ink3:#9A948C;
  --line:#E4DED5; --track:#B83A26; --track-bg:#F8E4DE; --track-ink:#7A2414;
  --girl:#A8345E; --girl-bg:#F9E3EB; --boy:#1F6E8C; --boy-bg:#E0EFF5;
  --soon:#8A5A00; --soon-bg:#FFF0CC; --live:#1E6B34; --live-bg:#DDF2E2;
  --warn:#9B1C1C; --warn-bg:#FDE4E4; --done:#B5AFA7;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151311; --card:#211E1B; --ink:#F3EFEA; --ink2:#BDB6AD; --ink3:#857E76;
    --line:#35302B; --track:#E2654D; --track-bg:#3A1F18; --track-ink:#F6B9AA;
    --girl:#EC8FB1; --girl-bg:#3A1E29; --boy:#7CC3DE; --boy-bg:#16303A;
    --soon:#F5C66B; --soon-bg:#3A2D0E; --live:#7FD597; --live-bg:#163222;
    --warn:#F5A3A3; --warn-bg:#3A1717; --done:#5C5650;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
.num{font-variant-numeric:tabular-nums;font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.lane{width:34px;height:34px;border-radius:10px;background:var(--track);display:grid;place-items:center;color:#fff;font-weight:700}
.lane svg{width:22px;height:22px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.02em}
.sub{font-size:12px;color:var(--ink2);margin:0}
.clock{display:flex;align-items:baseline;gap:6px;border:2px solid var(--track);border-radius:10px;padding:4px 10px;background:var(--card);white-space:nowrap}
.clock .cl{font-size:13px;color:var(--track);font-weight:700}
.clock .ct{font-size:22px;font-weight:800;color:var(--ink);line-height:1.2}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-top:10px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink2);font:inherit;font-size:15px;padding:8px 4px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--track);color:#fff;font-weight:700}
.filters{display:flex;gap:8px;margin-top:8px;align-items:center}
.filters select{flex:1;min-width:0;font:inherit;font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink2);font:inherit;font-size:14px;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:700}
.bento{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding:12px 14px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--track);color:var(--ink);text-decoration:none;font-size:15px}
.bento b{color:var(--track)}
.bento span:last-child{color:var(--track);font-weight:700;white-space:nowrap}
.hero{margin-top:12px;border-radius:var(--r);padding:14px 16px;background:var(--track-bg);color:var(--track-ink)}
.hero.soon{background:var(--soon-bg);color:var(--soon)}
.hero.now{background:var(--live-bg);color:var(--live)}
.hero .lbl{font-size:13px;display:flex;justify-content:space-between;gap:8px}
.hero .cd{font-size:34px;font-weight:800;line-height:1.15;margin:2px 0}
.hero .ev{font-size:17px;font-weight:700}
.hero .who{font-size:14px;margin-top:2px}
.alert{margin-top:10px;border-radius:12px;padding:10px 12px;background:var(--warn-bg);color:var(--warn);font-size:14px}
.alert b{display:block;margin-bottom:2px}
.alert ul{margin:0;padding-left:18px}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:10px 8px;border-radius:12px;cursor:pointer;text-decoration:none}
.btn.on{border-color:var(--live);color:var(--live);font-weight:700}
.btn svg{width:18px;height:18px;flex:none}
.hint{font-size:12px;color:var(--ink3);margin:6px 2px 0}
.sec{font-size:13px;color:var(--ink3);margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.sec button{border:0;background:none;color:var(--track);font:inherit;font-size:13px;cursor:pointer;padding:0}
.row{display:grid;grid-template-columns:54px 1fr;gap:10px;margin-bottom:10px}
.t{text-align:right;padding-top:12px}
.t .c{font-size:18px;font-weight:800}
.t .s{font-size:11px;color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative}
.card.st-soon{border-color:var(--soon);box-shadow:0 0 0 1px var(--soon) inset}
.card.st-check{border-color:var(--live);box-shadow:0 0 0 1px var(--live) inset}
.card.st-done{opacity:.55}
.card.out{opacity:.45}
.h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.title{font-size:17px;font-weight:700;line-height:1.3}
.title small{font-size:12px;font-weight:400;color:var(--ink3);margin-right:6px}
.g{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;margin-right:6px;vertical-align:2px}
.g.f{background:var(--girl-bg);color:var(--girl)} .g.m{background:var(--boy-bg);color:var(--boy)}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;flex:none}
.b-soon{background:var(--soon-bg);color:var(--soon)} .b-check{background:var(--live-bg);color:var(--live)}
.b-live{background:var(--live);color:var(--card)} .b-done{background:transparent;color:var(--ink3);border:1px solid var(--line)}
.b-later{display:none}
.meta{font-size:14px;color:var(--ink2);margin-top:4px}
.meta .num{color:var(--ink);font-weight:700}
.note{font-size:13px;color:var(--ink3);margin-top:2px}
.ath{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.a{font-size:14px;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.a .p{color:var(--ink2);font-size:12px;margin-left:3px}
.a.me{border-color:var(--track);background:var(--track-bg);color:var(--track-ink)}
.relay{font-size:13px;color:var(--ink2);margin-top:8px}
.relay b{color:var(--ink)}
.adv{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink2)}
.adv .q{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tog{font:inherit;font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer}
.tog.yes{border-color:var(--live);background:var(--live-bg);color:var(--live);font-weight:700}
.tog.no{border-color:var(--done);color:var(--ink3)}
.tog.no.on{background:var(--bg);border-color:var(--ink3);color:var(--ink);font-weight:700}
.advh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ap{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.ap .an{min-width:4.5em;color:var(--ink);font-size:14px}
.ap .src{font-size:11px;color:var(--ink3)}
.reset{font:inherit;font-size:12px;border:0;background:none;color:var(--track);cursor:pointer;padding:2px 4px;text-decoration:underline}
.res{margin-top:10px;background:var(--bg);border-radius:10px;padding:8px 10px;font-size:14px}
.res b{color:var(--track)}
.empty{text-align:center;color:var(--ink3);padding:30px 10px;font-size:14px}
footer{font-size:12px;color:var(--ink3);text-align:center;margin-top:24px;line-height:1.7}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:20;max-width:92vw;width:520px;background:var(--soon-bg);color:var(--soon);border:2px solid var(--soon);border-radius:14px;padding:12px 14px;font-size:15px;box-shadow:0 8px 28px rgba(0,0,0,.18);display:none}
.toast.show{display:block}
.toast b{display:block;font-size:17px}
.toast button{margin-top:8px;font:inherit;font-size:14px;border:0;border-radius:8px;padding:6px 12px;background:var(--soon);color:var(--soon-bg);cursor:pointer}
</style>
</head>

</div>
<p class="hint" id="hint"></p>

<div id="list"></div>

<footer>

const UPDATED = "2026/11/25 08:45";
const REMIND_MIN = 15;
const RAW = 'https://raw.githubusercontent.com/chinshihh-code/track-meet-zhinan/main/results.json';

const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('zn_' + k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('zn_' + k, JSON.stringify(v)); }catch(e){} }
};
const qs = new URLSearchParams(location.search);
const simStart = qs.get('now') ? new Date(qs.get('now') + ':00+08:00').getTime() : null;
const loadAt = Date.now();
const now = () => simStart ? simStart + (Date.now() - loadAt) : Date.now();
const at = (d, t) => new Date(`${d}T${t}:00+08:00`).getTime();
const hm = ms => new Date(ms).toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit', hour12:false, timeZone:'Asia/Taipei'});
const todayStr = () => new Date(now()).toLocaleDateString('sv-SE', {timeZone:'Asia/Taipei'});
const MIN = 60000;

const isField = e => /跳|擲|鉛球/.test(e.item);
const isRelay = e => /接力/.test(e.item);
const TEAM = '指南實小接力隊';
const dur = e => isField(e) ? 90 : /競走/.test(e.item) ? 25 : 15;
const sexOf = e => e.group.startsWith('女') ? 'f' : 'm';
const short = e => (e.group.startsWith('女') ? '女乙' : '男乙');
MEET.forEach(e => {
  e.tCheck = at(e.date, e.check); e.tStart = at(e.date, e.start); e.tEnd = e.tStart + dur(e) * MIN;
  e.key = 'E' + e.no;
  e.needsAdv = MEET.some(o => o !== e && o.group === e.group && o.item === e.item && at(o.date, o.start) < e.tStart);
});

const DAYS = [...new Set(MEET.map(e => e.date))].sort();
const ATHLETES = (() => {
  const m = new Map();
  MEET.forEach(e => e.athletes.forEach(a => { if (!m.has(a.name)) m.set(a.name, {name:a.name, id:a.id, sex:sexOf(e)}); }));
  return [...m.values()].sort((x, y) => x.sex === y.sex ? x.id.localeCompare(y.id) : (x.sex === 'f' ? -1 : 1));
})();

let state = {
  day: DAYS.includes(todayStr()) ? todayStr() : (todayStr() > DAYS[DAYS.length - 1] ? DAYS[DAYS.length - 1] : DAYS[0]),
  who: store.get('who', ''),
  sex: 'all',
  showDone: false,
  adv: store.get('adv', {}),
  notify: store.get('notify', false),
};
if (state.who && !ATHLETES.some(a => a.name === state.who)) state.who = '';

let RES = {items:{}, published:[], updated:'', ok:true};
const keyOf = e => `${e.item}|${e.round}|${e.group[0]}`;
function rowsOf(e){ const r = RES.items && RES.items[keyOf(e)]; return r ? r : null; }
function rowFor(e, name){
  const R = rowsOf(e); if (!R) return null;
  if (isRelay(e)) return R.rows[0] || null;
  const a = e.athletes.find(x => x.name === name);
  return R.rows.find(r => (a && r.no === a.id) || r.name === name) || null;
}
function prevRound(e){
  return MEET.filter(o => o.group === e.group && o.item === e.item && o.tStart < e.tStart).sort((a, b) => b.tStart - a.tStart)[0];
}
function autoAdv(e, name){
  if (!e.needsAdv) return undefined;
  const own = rowsOf(e);
  if (own && rowFor(e, name)) return true;
  const p = prevRound(e); if (!p) return undefined;
  const R = rowsOf(p); if (!R) return undefined;
  const row = rowFor(p, name);
  if (row && row.ups) return true;
  if (R.upsKnown || own) return false;
  return undefined;
}
function advOf(e, name){
  const a = autoAdv(e, name); if (a !== undefined) return a;
  const k = e.key + ':' + (isRelay(e) ? '隊' : name);
  return state.adv[k];
}
async function loadResults(){
  try{
    let r = null;
    try{ r = await fetch(RAW + '?t=' + Date.now(), {cache:'no-store'}); }catch(e){}
    if (!r || !r.ok) r = await fetch('results.json?t=' + Date.now(), {cache:'no-store'});
    if (r.ok) { RES = await r.json(); render(); }
  }catch(e){}
}
function setAdv(e, name, v){
  const k = e.key + ':' + (isRelay(e) ? '隊' : name);
  if (v === undefined) delete state.adv[k]; else state.adv[k] = v;
  store.set('adv', state.adv); render();
}
function eliminated(e){
  if (!e.needsAdv) return false;
  if (isRelay(e)) return advOf(e, '隊') === false;
  const ppl = state.who ? e.athletes.filter(a => a.name === state.who) : e.athletes;
  return ppl.length > 0 && ppl.every(a => advOf(e, a.name) === false);
}
function status(e){
  const t = now();
  if (rowsOf(e) && t >= e.tStart) return 'done';
  if (t >= e.tEnd) return 'done';
  if (t >= e.tStart) return 'live';
  if (t >= e.tCheck) return 'check';
  if (t >= e.tCheck - 30 * MIN) return 'soon';
  return 'later';
}
const LABEL = {done:'已結束', live:'比賽中', check:'檢錄中', soon:'即將檢錄', later:''};

function visible(e){
  if (state.who) {
    if (isRelay(e) && !e.athletes.length) { const me = ATHLETES.find(a => a.name === state.who); if (me && me.sex !== sexOf(e)) return false; }
    else if (!e.athletes.some(a => a.name === state.who)) return false;
  }
  if (state.sex !== 'all' && sexOf(e) !== state.sex) return false;
  return true;
}

function conflicts(day){
  const out = [];
  const people = state.who ? [state.who] : ATHLETES.map(a => a.name);
  people.forEach(n => {
    const evs = MEET.filter(e => e.date === day && e.athletes.some(a => a.name === n) && !isRelay(e)).sort((a, b) => a.tCheck - b.tCheck);
    for (let i = 0; i < evs.length; i++) for (let j = i + 1; j < evs.length; j++) {
      const a = evs[i], b = evs[j];
      if (b.tCheck < a.tEnd) out.push(`${n}：${a.check} ${a.item}${a.round}（${hm(a.tStart)} 比賽）與 ${b.check} ${b.item}${b.round} 檢錄時間重疊`);
    }
  });
  return out;
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function heroHTML(){
  const t = now();
  const pool = MEET.filter(e => visible(e) && !eliminated(e) && e.tStart > t).sort((a, b) => a.tCheck - b.tCheck);
  if (!pool.length) {
    const last = DAYS[DAYS.length - 1];
    if (t > at(last, '23:59')) return `<div class="hero"><div class="ev">賽事已全部結束，辛苦了！</div></div>`;
    return `<div class="hero"><div class="ev">今天的賽事都結束了</div><div class="who">明天見</div></div>`;
  }
  const e = pool[0];
  const who = (state.who ? e.athletes.filter(a => a.name === state.who) : e.athletes).filter(a => advOf(e, a.name) !== false);
  const names = isRelay(e) ? `${e.lane ? e.lane + '・' : ''}${TEAM}` : who.map(a => a.name + (a.pos ? `（${a.pos}）` : '')).join('、');
  let cls = '', lbl, cd;
  if (t >= e.tCheck) { cls = 'now'; lbl = '正在檢錄'; cd = `${hm(e.tStart)} 開始比賽`; }
  else {
    const m = Math.ceil((e.tCheck - t) / MIN);
    lbl = '下一個檢錄';
    if (m <= 30) cls = 'soon';
    cd = m >= 60 * 20 ? `${e.date.slice(5).replace('-', '/')} ${e.check}` : m >= 60 ? `${Math.floor(m / 60)} 小時 ${m % 60} 分` : `還有 ${m} 分鐘`;
  }
  const dayTag = e.date !== todayStr() ? `${+e.date.slice(5, 7)}/${+e.date.slice(8)}` : '';
  return `<div class="hero ${cls}">
    <div class="lbl"><span>${lbl}${dayTag ? '・' + dayTag : ''}</span><span class="num">檢錄 ${e.check}・比賽 ${e.start}</span></div>
    <div class="cd num">${cd}</div>
    <div class="ev">${short(e)} ${esc(e.item)} ${e.round}${e.needsAdv ? '（需晉級）' : ''}</div>
    <div class="who">${esc(names)}</div>
    ${pool[1] ? `<div class="who" style="margin-top:8px;opacity:.85">接著：<span class="num">${pool[1].check}</span> 檢錄・${short(pool[1])} ${esc(pool[1].item)} ${pool[1].round}</div>` : ''}</div>`;
}

function cardHTML(e){
  const st = status(e), out = eliminated(e);
  const hl = n => state.who === n ? ' me' : '';
  let ath = '';
  if (isRelay(e)) {
    ath = `<div class="relay">${e.lane ? `<b>${e.lane}</b>・` : ''}${!e.athletes.length ? TEAM : ''}${e.athletes.map(a => `<span class="${state.who === a.name ? 'me-t' : ''}">${state.who === a.name ? '<b>' + esc(a.name) + '</b>' : esc(a.name)}</span>`).join('、')}</div>`;
  } else {
    ath = `<div class="ath">${e.athletes.map(a => `<span class="a${hl(a.name)}">${esc(a.name)}${a.pos ? `<span class="p">${esc(a.pos)}</span>` : ''}</span>`).join('')}</div>`;
  }
  let adv = '';
  if (e.needsAdv && st !== 'done') {
    const ppl = isRelay(e) ? [{name:'隊'}] : e.athletes;
    const anyLocal = ppl.some(a => autoAdv(e, a.name) === undefined && state.adv[e.key + ':' + (isRelay(e) ? '隊' : a.name)] !== undefined);
    adv = `<div class="adv"><div class="advh"><span>有晉級嗎？</span>${anyLocal ? `<button class="reset" data-reset="${e.no}">重置</button>` : ''}</div>${ppl.map(a => {
      const v = advOf(e, a.name);
      const label = isRelay(e) ? '本隊' : a.name;
      const auto = autoAdv(e, a.name);
      if (auto !== undefined) return `<div class="ap"><span class="an">${esc(label)}</span><span class="tog ${auto ? 'yes' : 'no'}">${auto ? '✓ 晉級' : '沒晉級'}</span><span class="src">大會成績</span></div>`;
      return `<div class="ap"><span class="an">${esc(label)}</span><button class="tog ${v === true ? 'yes' : ''}" data-ev="${e.no}" data-n="${esc(a.name)}" data-v="1" aria-pressed="${v === true}">晉級</button><button class="tog ${v === false ? 'no on' : ''}" data-ev="${e.no}" data-n="${esc(a.name)}" data-v="0" aria-pressed="${v === false}">沒晉級</button></div>`;
    }).join('')}</div>`;
  }
  let res = '';
  const R = rowsOf(e);
  if (R) {
    const ppl = isRelay(e) ? [{name:'隊'}] : e.athletes;
    const lines = ppl.map(a => {
      const r = rowFor(e, a.name);
      const nm = isRelay(e) ? '本隊' : a.name;
      if (!r) return `<div>${esc(nm)}：<span style="color:var(--ink3)">沒有成績</span></div>`;
      const bits = [r.score ? `<b class="num">${esc(r.score)}</b>` : '', r.wind ? `風速 ${esc(r.wind)}` : '', r.rank ? `第 ${r.rank} 名` : '', r.ups ? '<b>晉級</b>' : '', r.remark ? esc(r.remark) : ''].filter(Boolean);
      return `<div>${esc(nm)}：${bits.join('・') || '—'}</div>`;
    }).join('');
    res = `<div class="res"><div style="font-size:12px;color:var(--ink3);margin-bottom:2px">大會成績</div>${lines}</div>`;
  }
  const badge = out ? `<span class="badge b-done">未晉級</span>` : LABEL[st] ? `<span class="badge b-${st}">${LABEL[st]}</span>` : '';
  return `<div class="row" id="ev${e.no}">
    <div class="t"><div class="c num">${e.check}</div><div class="s">檢錄</div></div>
    <div class="card st-${st}${out ? ' out' : ''}">
      <div class="h"><div class="title"><span class="g ${sexOf(e)}">${short(e)}</span>${esc(e.item)} ${e.round}</div>${badge}</div>
      <div class="meta"><small>#${e.no}</small> 比賽 <span class="num">${e.start}</span>・${esc(e.note)}</div>
      ${ath}${res}${adv}
    </div></div>`;
}

function render(){
  $('#clock').textContent = hm(now());
  $('#days').innerHTML = DAYS.map(d => {
    const lab = `${+d.slice(5, 7)}/${+d.slice(8)}` + (d === todayStr() ? '（今天）' : '');
    return `<button aria-pressed="${d === state.day}" data-day="${d}">${lab}</button>`;
  }).join('');
  document.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.sex === state.sex));
  $('#hero').innerHTML = heroHTML();
  const cf = conflicts(state.day);
  $('#conflicts').innerHTML = cf.length ? `<div class="alert"><b>⚠ 檢錄時間撞期，請先跟教練確認</b><ul>${cf.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>` : '';
  const evs = MEET.filter(e => e.date === state.day && visible(e));
  const done = evs.filter(e => status(e) === 'done');
  const rest = evs.filter(e => status(e) !== 'done');
  let html = '';
  if (!evs.length) html = `<div class="empty">${state.who ? esc(state.who) + ' 這天沒有項目' : '這天沒有項目'}</div>`;
  if (done.length) {
    html += `<div class="sec"><span>已結束 ${done.length} 項</span><button id="toggleDone">${state.showDone ? '收起' : '展開'}</button></div>`;
    if (state.showDone) html += done.map(cardHTML).join('');
  }
  if (rest.length) html += `<div class="sec"><span>${done.length ? '接下來' : '賽程'}・${rest.length} 項</span></div>` + rest.map(cardHTML).join('');
  $('#list').innerHTML = html;
  const nb = $('#notify');
  nb.classList.toggle('on', state.notify);
  nb.querySelector('span').textContent = state.notify ? '提醒已開啟' : '開啟檢錄提醒';
  $('#ics').querySelector('span').textContent = state.who ? '加入行事曆' : '加入手機行事曆';
  $('#hint').textContent = state.notify
    ? `檢錄前 ${REMIND_MIN} 分鐘會提醒${state.who ? ' ' + state.who + ' 的項目' : '所有項目'}（網頁要保持開著）。關掉網頁也要提醒，請用「加入行事曆」。`
    : (state.who ? '' : '先在上面選你的孩子，就只看他的項目，提醒也只提醒他的。');
  $('#updated').textContent = RES.updated ? (RES.ok ? `成績自動更新：${RES.updated}` : `成績網站暫時連不到（${RES.updated}），晉級請先手動勾`) : `賽程資料：${UPDATED}`;
}

// events
document.addEventListener('click', ev => {
  const d = ev.target.closest('[data-day]'); if (d) { state.day = d.dataset.day; state.showDone = false; render(); scrollTo({top:0}); return; }
  const s = ev.target.closest('[data-sex]'); if (s) { state.sex = s.dataset.sex; render(); return; }
  if (ev.target.closest('#toggleDone')) { state.showDone = !state.showDone; render(); return; }
  const tg = ev.target.closest('button.tog');
  if (tg) {
    const e = MEET.find(x => x.no === +tg.dataset.ev); const n = tg.dataset.n;
    const want = tg.dataset.v === '1'; const v = advOf(e, n);
    setAdv(e, n, v === want ? undefined : want); return;
  }
  const rs = ev.target.closest('[data-reset]');
  if (rs) {
    const e = MEET.find(x => x.no === +rs.dataset.reset);
    Object.keys(state.adv).forEach(k => { if (k.startsWith(e.key + ':')) delete state.adv[k]; });
    store.set('adv', state.adv); render(); return;
  }
  const ra = ev.target.closest('#resetAll');
  if (ra) {
    if (!Object.keys(state.adv).length) { ra.textContent = '目前沒有勾選'; setTimeout(() => ra.textContent = '清除全部晉級勾選', 1500); return; }
    if (ra.dataset.armed !== '1') { ra.dataset.armed = '1'; ra.textContent = '再按一次確認清除'; setTimeout(() => { ra.dataset.armed = ''; ra.textContent = '清除全部晉級勾選'; }, 3000); return; }
    state.adv = {}; store.set('adv', state.adv); ra.dataset.armed = ''; ra.textContent = '已清除'; render(); setTimeout(() => ra.textContent = '清除全部晉級勾選', 1500); return;
  }
});
const sel = $('#who');
sel.innerHTML = `<option value="">全部選手</option>` +
  `<optgroup label="女生">${ATHLETES.filter(a => a.sex === 'f').map(a => `<option value="${esc(a.name)}">${esc(a.name)}（${a.id}）</option>`).join('')}</optgroup>` +
  `<optgroup label="男生">${ATHLETES.filter(a => a.sex === 'm').map(a => `<option value="${esc(a.name)}">${esc(a.name)}（${a.id}）</option>`).join('')}</optgroup>`;
sel.value = state.who;
sel.addEventListener('change', () => {
  state.who = sel.value; store.set('who', state.who);
  if (state.who) { state.sex = 'all'; const has = MEET.some(e => e.date === state.day && e.athletes.some(a => a.name === state.who)); if (!has) { const d = MEET.find(e => e.athletes.some(a => a.name === state.who)); if (d) state.day = d.date; } }
  render();
});

// reminders
const toast = $('#toast');
function beep(){
  try{
    const C = new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].forEach(o => { const os = C.createOscillator(), g = C.createGain(); os.frequency.value = 880; os.connect(g); g.connect(C.destination); g.gain.setValueAtTime(.25, C.currentTime + o); g.gain.exponentialRampToValueAtTime(.001, C.currentTime + o + .28); os.start(C.currentTime + o); os.stop(C.currentTime + o + .3); });
  }catch(e){}
}
function remind(list){
  const line = e => `${short(e)} ${e.item} ${e.round}（${isRelay(e) ? TEAM : state.who ? state.who : e.athletes.map(a => a.name).join('、')}）`;
  const title = `${REMIND_MIN} 分鐘後檢錄（${list[0].check}）`;
  const body = list.map(line).join('\n');
  toast.innerHTML = `<b>${esc(title)}</b>${list.map(e => esc(line(e)) + `・比賽 ${e.start}`).join('<br>')}<br><button id="tclose">知道了</button>`;
  toast.classList.add('show');
  beep(); try{ navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); }catch(err){}
  try{ if ('Notification' in window && Notification.permission === 'granted') new Notification(title, {body, tag:list[0].key}); }catch(err){}
}
toast.addEventListener('click', ev => { if (ev.target.id === 'tclose') toast.classList.remove('show'); });
function checkReminders(){
  if (!state.notify) return;
  const sent = store.get('sent', {}); const t = now(); const due = [];
  MEET.filter(e => visible(e) && !eliminated(e)).forEach(e => {
    const fire = e.tCheck - REMIND_MIN * MIN;
    const id = e.key + '|' + (state.who || '*');
    if (t >= fire && t < e.tCheck && !sent[id]) { sent[id] = 1; due.push(e); }
  });
  if (due.length) { store.set('sent', sent); remind(due); }
}
$('#notify').addEventListener('click', async () => {
  if (state.notify) { state.notify = false; store.set('notify', false); render(); return; }
  try{ if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission(); }catch(e){}
  state.notify = true; store.set('notify', true); beep(); render(); checkReminders();
});

// calendar
function icsTime(ms){ return new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
$('#ics').addEventListener('click', () => {
  const evs = MEET.filter(e => visible(e));
  if (!evs.length) return;
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//track-meet//zh-TW', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:指南田徑賽程' + (state.who ? '－' + state.who : '')];
  evs.forEach(e => {
    const who = state.who ? e.athletes.filter(a => a.name === state.who) : e.athletes;
    const names = isRelay(e) && !e.athletes.length ? TEAM : who.map(a => a.name + (a.pos ? `（${a.pos}）` : '')).join('、');
    L.push('BEGIN:VEVENT', `UID:${e.key}-${state.who || 'all'}@track-meet-zhinan`, `DTSTAMP:${icsTime(Date.now())}`,
      `DTSTART:${icsTime(e.tCheck)}`, `DTEND:${icsTime(e.tEnd)}`,
      `SUMMARY:檢錄｜${short(e)} ${e.item} ${e.round}${e.needsAdv ? '（需晉級）' : ''}`,
      `DESCRIPTION:檢錄 ${e.check}・比賽 ${e.start}\\n${(isRelay(e) && e.lane ? e.lane + '・' : '') + names}\\n${e.note}\\n項次 ${e.no}`,
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${REMIND_MIN} 分鐘後檢錄`, `TRIGGER:-PT${REMIND_MIN}M`, 'END:VALARM', 'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  const blob = new Blob([L.join('\r\n')], {type:'text/calendar;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `指南田徑賽程${state.who ? '_' + state.who : ''}.ics`; document.body.appendChild(a); a.click(); a.remove();
});
$('#share').addEventListener('click', async () => {
  const url = location.href.split('?')[0];
  try{ if (navigator.share) { await navigator.share({title:'指南實小田徑賽程', url}); return; } }catch(e){ return; }
  try{ await navigator.clipboard.writeText(url); alert('網址已複製'); }catch(e){ prompt('複製這個網址', url); }
});

render(); checkReminders(); loadResults();
setInterval(() => { render(); checkReminders(); }, 20000);
setInterval(loadResults, 120000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); checkReminders(); loadResults(); } });
</script>
</body>
</html>
